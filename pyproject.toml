[project]
name = "futebol-pubsub"
version = "0.1.0"
description = "Pub/Sub para placar de futebol em tempo real"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/broker", "src/publisher", "src/subscriber"]
